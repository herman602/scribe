[alembic]
script_location = %(here)s/app/infrastructure/database/migrations
prepend_sys_path = .
path_separator = os
# Deliberately no sqlalchemy.url. A bare `alembic upgrade head` that silently
# targeted the configured database has already caused one accidental migration
# of real data, so env.py refuses to run until the target is named explicitly,
# by SCRIBE_DATABASE_PATH or by `-x database=<path>`. Programmatic callers in
# app.infrastructure.database.migrations still set the URL themselves.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

name: Bug report
description: Report a reproducible Scribe problem using only synthetic data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Scribe.

        **Do not attach credentials, a database or backup, logs, a real email or
        PDF, account or card numbers, or a financial screenshot.** Replace all
        identities, institutions, merchants, amounts, dates, suffixes, and
        message IDs with invented values. Security issues belong in the private
        process described in `SECURITY.md`, not in a public issue.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only synthetic data and did not include private financial material.
          required: true
        - label: I reviewed pasted output for credentials, database paths, tokens, and logs.
          required: true

  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior without private data.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal synthetic reproduction
      description: List the smallest safe steps and invented inputs that reproduce it.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Scribe version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Python and operating system
      placeholder: Python 3.12, macOS 15
    validations:
      required: true

